name: Store maintenance

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: store-maintenance-production
  cancel-in-progress: false

jobs:
  maintain:
    if: github.repository == 'iyayusufspantry/iyayusufspantry-com'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Reconcile sandbox orders and retry queued email
        env:
          MAINTENANCE_TOKEN: ${{ secrets.PANTRY_MAINTENANCE_TOKEN }}
        run: |
          if [ -z "$MAINTENANCE_TOKEN" ]; then
            echo "Maintenance token is not configured."
            exit 1
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 15 --max-time 290 \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            'https://www.iyayusufspantry.com/api/cron/maintenance')
          if [ "$status" != "200" ]; then
            echo "Maintenance returned HTTP $status."
            exit 1
          fi
          echo "Store maintenance completed successfully."
